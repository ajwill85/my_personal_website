AWSTemplateFormatVersion: '2010-09-09'
Description: 'Contact Form API - Lambda + API Gateway for handling form submissions'

Parameters:
  SESFromEmail:
    Type: String
    Description: Verified SES email address for sending emails. Required; pass it at deploy time.

  SESIdentityName:
    Type: String
    Default: ''
    Description: >
      Verified SES identity the function may send as. Use an email address or a
      domain. Leave blank to use SESFromEmail.

  ContactToEmail:
    Type: String
    Description: Recipient address for contact form mail. Required; pass it at deploy time.

  FunctionName:
    Type: String
    Default: ajwill-contact-form-handler
    Description: Lambda function name. Default matches the deployed function.

  ApiName:
    Type: String
    Default: ajwill-contact-form-api
    Description: HTTP API name. Default matches the deployed API.

Conditions:
  HasExplicitSesIdentity: !Not [!Equals [!Ref SESIdentityName, '']]

Resources:
  # IAM Role for Lambda
  ContactFormLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ContactFormLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESSendEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub
                  - 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${IdentityName}'
                  - IdentityName: !If
                      - HasExplicitSesIdentity
                      - !Ref SESIdentityName
                      - !Ref SESFromEmail

  # Lambda Function
  ContactFormFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ContactFormLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          FROM_EMAIL: !Ref SESFromEmail
          SES_FROM_EMAIL: !Ref SESFromEmail
          TO_EMAIL: !Ref ContactToEmail
      Code:
        ZipFile: |
          // Placeholder - will be updated via deployment script
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ message: 'Function not yet deployed' })
            };
          };

  # API Gateway REST API
  ContactFormApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref ApiName
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - 'https://ajwill.ai'
          - 'https://www.ajwill.ai'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 300
        AllowCredentials: false

  # API Gateway Integration
  ContactFormIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ContactFormApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # API Gateway Route
  ContactFormRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ContactFormApi
      RouteKey: 'POST /contact'
      Target: !Sub 'integrations/${ContactFormIntegration}'

  # API Gateway Stage
  ContactFormStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ContactFormApi
      StageName: prod
      AutoDeploy: true
      # Low steady rate and a small burst for a personal contact form.
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  # Lambda Permission for API Gateway
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFormFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContactFormApi}/*'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ContactFormApi}.execute-api.${AWS::Region}.amazonaws.com/prod/contact'
    Export:
      Name: ContactFormApiEndpoint

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ContactFormFunction.Arn
    Export:
      Name: ContactFormLambdaArn
